# 全局配置
# 时间统一使用北京时间（Asia/Shanghai）

timezone: "Asia/Shanghai"

# 输出文件配置
output:
  dir: "data/output"
  files:
    - name: "hosts.txt"            # hosts 格式（传统 hosts 风格）
      format: "hosts"
    - name: "adblock.txt"          # AdGuard/adblock 语法
      format: "adblock"
    - name: "黑名单.txt"           # 黑名单（AdGuard 标准语法）
      format: "blacklist"
    - name: "白名单.txt"           # 白名单
      format: "whitelist"

# 生成的仓库内引用文件名（AdGuard Home 订阅链接用）
repository:
  branch: "main"
  # 成品文件相对仓库根路径
  output_dir_in_repo: "data/output"
  # 仓库名/用户名，由 README 生成器从 git remote 自动探测，也可手动覆盖
  owner: ""
  repo: ""

# CDN 加速链接（两种前缀，自动生成）
cdn:
  - name: "raw.githubusercontent.com"
    url_template: "https://raw.githubusercontent.com/{owner}/{repo}/{branch}/{path}"
  - name: "cdn.jsdelivr.net"
    url_template: "https://cdn.jsdelivr.net/gh/{owner}/{repo}@{branch}/{path}"

# 白名单中需要剔除的广告网络/追踪联盟域名。
# 这些域名若被白名单放行，DNS 层将直接放行广告域名的解析，导致广告无法拦截。
# 规则：白名单中命中以下域名（含其子域）的规则一律剔除。
whitelist_exclude_domains:
  - "adsterra.com"
  - "taboola.com"
  - "doubleclick.net"
  - "commission-junction.com"
  - "awin.com"
  - "awin1.com"
  - "crwdcntrl.net"
  - "id5-sync.com"
  - "liadm.com"
  - "pgpartner.com"
  - "rlcdn.com"
  - "mczbf.com"
  - "ezodn.com"
  - "afi-b.com"
  - "logentries.com"
  - "statcounter.com"
  - "appmetrica.yandex.com"
  - "appmetrica.yandex.net"
  - "flurry.com"
  - "videoplayerhub.com"
  - "emjcd.com"
  - "smartredirect.de"
  - "swjoy.com"
  - "sjwoe.com"
  - "kdukvh.com"
  - "pkracv.com"
  - "ay.delivery"
  - "coral.coralproject.net"
  # 穿山甲（Pangle）广告 SDK 专用域名——只服务广告，拦截不影响字节系 App 正常功能
  - "pangolin-sdk-toutiao.com"
  - "pangolin-sdk-toutiao-b.com"
  - "ib.snssdk.com"
  - "ic.snssdk.com"
  - "is.snssdk.com"
  - "oceanengine.com"
  - "bytedanceapi.com"

# README 生成配置
readme:
  template: "README.template.md"
  output: "README.md"
  title: "AdGuard Home 规则聚合订阅"
  description: "自动聚合多个开源黑白名单，经语法校验、分类、去重后生成 AdGuard Home 可订阅的规则文件，并每 8 小时按北京时间自动更新。"

# 分类统计展示顺序
category_order:
  - advertising
  - tracking
  - social
  - adult
  - phishing
  - malware
  - other
