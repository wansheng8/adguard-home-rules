name: sync-rules

on:
  schedule:
    # 北京时间每 8 小时：0点 / 8点 / 16点
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TZ: "Asia/Shanghai"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行流水线
        run: python -m adguard_sync.pipeline

      - name: 展示北京时间
        run: date "+%Y-%m-%d %H:%M:%S %Z (%z)"

      - name: 提交产物
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 自动同步规则 $(date '+%Y-%m-%d %H:%M:%S') 北京时间"
            git push
          fi
